apiVersion: v1
kind: Namespace
metadata:
  name: anytype-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anytype-api-config
  namespace: anytype-api
data:
  network.yml: |
    paste your network.yml content here
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anytype-api-data
  namespace: anytype-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
# Anytype's own data (space stores, object store, device key, API keys) lives in
# ~/.config/anytype/data, which the image links to /config/data. Without a volume
# there, every pod restart starts empty: it re-syncs from the network and loses
# the device identity and all API keys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anytype-api-storage
  namespace: anytype-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anytype-api
  namespace: anytype-api
spec:
  replicas: 1
  # one pod at a time: two anytype processes must never share the data volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anytype-api
  template:
    metadata:
      labels:
        app: anytype-api
    spec:
      containers:
      - name: anytype-api
        image: immortalvision/anytype-api:latest
        imagePullPolicy: Always
        command: ["anytype", "serve", "--listen-address", "0.0.0.0:80"]
        env:
        # the API only answers localhost/IP hosts unless the public host is allowed
        - name: ANYTYPE_API_ALLOWED_HOSTS
          value: "anytype-api.your-domian.tld"
        - name: ANYTYPE_API_ALLOWED_ORIGINS
          value: "https://anytype-api.your-domian.tld"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
          - name: config-volume
            mountPath: /config/network.yml
            subPath: network.yml
          - name: data-volume
            mountPath: /root/.anytype
          - name: storage-volume
            mountPath: /config/data
      volumes:
      - name: config-volume
        configMap:
          name: anytype-api-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: anytype-api-data
      - name: storage-volume
        persistentVolumeClaim:
          claimName: anytype-api-storage
---
apiVersion: v1
kind: Service
metadata:
  name: anytype-api
  namespace: anytype-api
spec:
  selector:
    app: anytype-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anytype-api
  namespace: anytype-api
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
spec:
  ingressClassName: public
  rules:
  - host: anytype-api.your-domian.tld
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: anytype-api
              port:
                name: http
  tls:
  - hosts:
    - anytype-api.your-domian.tld
    secretName: anytype-api-tls
      

